<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modüler Masraf Talebi</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#172033}
    .card{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
    h1{font-size:22px;margin:0 0 8px}.sub{color:#667085;font-size:14px;margin-bottom:22px}
    label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
    input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #d0d5dd;font-size:15px}
    textarea{min-height:90px;resize:vertical}
    button{margin-top:18px;background:#123c69;color:white;border:none;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .status{margin-top:14px;padding:12px;border-radius:10px;background:#eef4ff;color:#123c69;font-size:14px;white-space:pre-wrap}
    .hint{color:#667085;font-size:12px;margin-top:6px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Personel Masraf Talebi</h1>
    <div class="sub">Fiş fotoğrafını yükle, tutarı kontrol et, Bitrix24’e görsel ekiyle gönder.</div>

    <label>Fiş / Fatura Fotoğrafı</label>
    <input type="file" id="file" accept="image/*" />

    <label>Masraf Türü</label>
    <select id="expenseType">
      <option>Otopark</option>
      <option>Yemek</option>
      <option>Yakıt / Yol</option>
      <option>Konaklama</option>
      <option>Kargo</option>
      <option>Genel Harcama</option>
      <option>Demirbaş</option>
      <option>Diğer</option>
    </select>

    <label>Tutar</label>
    <input type="text" id="amount" placeholder="Örn: 250,00" />
    <div class="hint">OCR tutarı okuyamazsa elle yazabilirsin.</div>

    <label>Açıklama</label>
    <textarea id="desc" placeholder="Örn: Müşteri ziyareti otopark fişi"></textarea>

    <button id="sendBtn" onclick="upload()">Bitrix24’e Gönder</button>
    <div id="status" class="status">Hazır.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
